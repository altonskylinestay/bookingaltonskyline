<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alton Skyline Stay</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>
<body>

<header class="header">
<div class="logo">
<img id="logoImg" src="https://i.imgur.com/8Km9tLL.png">
</div>

<button class="menu-btn" onclick="toggleAdmin()">
<i class="fas fa-bars"></i>
</button>
</header>

<section class="hero">
<img id="heroImage"
src="https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=1200">

<div class="hero-overlay">
<h1 id="heroTitle">Premium Stay in Semarang</h1>
<p id="heroDesc">
Nikmati pengalaman menginap modern dekat UNDIP.
</p>
</div>
</section>

<section class="rooms">

<h2>Pilihan Kamar</h2>

<div id="roomContainer"></div>

</section>

<div class="floating-help">
<p>Butuh bantuan? klik.</p>

<a id="waFloat"
href="https://wa.me/628976660674"
target="_blank">

<i class="fab fa-whatsapp"></i>

</a>
</div>

<div class="admin-panel" id="adminPanel">

<div class="admin-box">

<h2>Admin Panel</h2>

<input type="password"
id="adminPassword"
placeholder="Password">

<button onclick="loginAdmin()">
Login
</button>

<div id="adminContent" style="display:none;">

<h3>Hero</h3>

<input id="editTitle"
placeholder="Judul Hero">

<textarea id="editDesc"
placeholder="Deskripsi"></textarea>

<input id="editHeroImage"
placeholder="Link Gambar Hero">

<button onclick="saveHero()">
Simpan Hero
</button>

<hr>

<h3>Tambah Kamar</h3>

<input id="roomName"
placeholder="Nama kamar">

<input id="roomPrice"
placeholder="Harga">

<input id="roomImage"
placeholder="Link gambar">

<select id="roomStatus">
<option value="true">Tampilkan</option>
<option value="false">Hide</option>
</select>

<button onclick="addRoom()">
Tambah Kamar
</button>

<hr>

<div id="adminRooms"></div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
