<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alton Skyline CMS</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="admin-page">

<!-- LOGIN -->

<div class="admin-login" id="loginBox">

<img
src="assets/logo.png"
class="admin-logo"
>

<h1>
Admin Login
</h1>

<p>
Alton Skyline Stay CMS
</p>

<input
type="text"
id="username"
placeholder="Username"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button onclick="loginAdmin()">

Login

</button>

</div>

<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

<div class="dashboard-top">

<div>

<h2>
Alton Skyline CMS
</h2>

<p>
Luxury Apartment Management
</p>

</div>

<a
href="index.html"
class="back-btn">

Back Website

</a>

</div>

<!-- STATS -->

<div class="dashboard-info">

<div class="dashboard-card">

<h3>
TOTAL SLOT
</h3>

<p>
21
</p>

</div>

<div class="dashboard-card">

<h3>
VISIBLE ROOM
</h3>

<p id="visibleCount">
0
</p>

</div>

</div>

<!-- ADD ROOM -->

<div style="margin-bottom:30px;">

<button
onclick="addRoom()"
class="back-btn">

+ Tambah Kamar

</button>

</div>

<!-- ROOM LIST -->

<div id="adminRoomList">

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
